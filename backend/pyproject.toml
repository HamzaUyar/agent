[project]
name = "roketsan-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.8",
    "openai>=1.40",
    "pillow>=10",
    "evren-sdk>=0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 1. aşama tespit modeli (DETECTOR_MODE=model); torch'u da kurar.
model = [
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
make-mock-data = "scripts.make_mock_data:main"
load-data = "scripts.load_data:main"
export-claims = "scripts.export_claims:main"
upload-images = "scripts.upload_images:main"
run-eval-set = "scripts.run_eval_set:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["core/*.toml", "llm/*.toml", "agent/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
