[project]
name = "roketsan-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.8",
    "openai>=1.40",
    "pillow>=10",
    "evren-sdk>=0.9",
    "httpx>=0.27",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
make-mock-data = "scripts.make_mock_data:main"
load-data = "scripts.load_data:main"
export-claims = "scripts.export_claims:main"
upload-images = "scripts.upload_images:main"
run-eval-set = "scripts.run_eval_set:main"
compute-risk = "scripts.compute_risk:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["core/*.toml", "llm/*.toml", "agent/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "scripts"]

[[tool.mypy.overrides]]
# scipy tip bilgisi taşımıyor (yalnızca linear_sum_assignment kullanılıyor).
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy'yle gelen numpy'nin stub'ları 3.12 sözdizimi kullanıyor (Pillow'un tipleri üzerinden
# yükleniyor); hedef 3.11 olduğu için içine girilmez.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
