# Temel seviye tablosu ve hareket analizi eşikleri (ADR-0002: temel seviyeyi kurallar verir).
# Gerçek veri geldiğinde değerlendirme setiyle ayarlanacak (ticket 13).

[detection]
# Altı yok sayılır; arası zayıf tespittir (yalnızca bir track'le eşleşirse temas sayılır).
# Tespit bileşenleri modelden `app.pipelines.detection.MIN_CONFIDENCE` (0,20) ve üstünü ister;
# daha düşük bir eşik o değer düşürülmeden işe yaramaz.
min_confidence = 0.20
strong_confidence = 0.50

[matching]
# Görüntü başına birebir eşleme: aday track'ler çekim anında görüntünün alanı içinde olanlar;
# eşik içindeki çiftler arasından toplam mesafeyi en aza indiren atama seçilir (Hungarian).
# Maliyet = mesafe + score_tiebreak × (1 − güven): mesafeler neredeyse eşitse güçlü tespit kazanır.
# Gerçek veride (detections_all.csv) 206 track noktasının 191'i eşleşiyor; ortanca 0,13 m,
# en uzak 1,85 m. 2–3 m eşik de aynı sonucu veriyor.
threshold_m = 5.0
score_tiebreak = 0.01

[trend]
# Son `window_minutes` içinde üsse mesafe `threshold_m`'den fazla azaldıysa "yaklaşıyor".
window_minutes = 30
threshold_m = 300
# Bu mesafeden az yer değiştirdiyse "yerinde duruyor" (ve yön hesaplanmaz).
stationary_displacement_m = 100

[motion]
history_minutes = 120
# Hız ve yön bu pencereden okunur; eğilimle aynı (görev tanımı s3: tek adımdan değil).
recent_window_minutes = 30
# Ardışık noktalar ilk noktadan bu kadar uzaklaşmadıysa duraklama sayılır.
stop_displacement_m = 50
stop_min_minutes = 10

[brief]
# LLM karar ayarı ve brief için süre sınırı (sn); aşılırsa otomatik özete geçilir.
timeout_s = 45
max_tokens = 4096

[levels]
# Temel seviyeyi risk motoru verir (risk_engine.toml). Buradaki eşikler, karar LLM'inin
# önerdiği dikkat nedenlerini kodla doğrulamak için kullanılır.
# "kayıt dışı" nedeni: track'i olmayan araç kendi başına risk değildir (park halinde olabilir,
# ADR-0003); neden yalnızca üsse bu mesafeden yakınsa kabul edilir.
unregistered_alert_m = 1000
# "uzun duraklama" nedeni: üsse `loiter_m`'den yakın bir yerde en az `loiter_minutes` duraklama.
loiter_minutes = 30
loiter_m = 3000
# Üs çevresinde dolaşma (görev tanımı s3): üsse mesafesi kayıt boyunca `circle_band_m` içinde
# kalan, `loiter_m`'den yakın, en az `circle_min_extent_m` genişliğinde bir yay çizen ve en az
# `circle_min_path_m` yol yapan araç ("dolaşma" nedeni). Gerçek veride 6 track 1,6-2,6 km'de,
# mesafesi 20 m'den az oynayarak 16-29 km yol yapıyor (yay 3,2-4,5 km); yerel trafik 600 m
# içinde kalır.
circle_band_m = 300
circle_min_path_m = 3000
circle_min_extent_m = 1500
