# Model kataloğu ve görev → model zinciri. Zincir sırayla denenir: kimlik bilgisi
# olmayan model atlanır, hata veren ya da şemaya uymayan cevapta sıradakine geçilir.
# Bütün görevler organizatörlerin gateway'indeki glm-5.3-flash ile başlar (görev tanımı s4;
# görüntü de okur, s7). GLM_API_KEY yoksa ya da bütçe dolduysa EVREN'e geçilir. EVREN'deki
# glm-5.3 görüntü almadığı için VLM yedekleri başka modellerdir.

# --- EVREN (SSB, https://evren-llmapi.ssyz.org.tr/v1) ---------------------------
[models.glm53]
provider = "evren"
model_id = "glm-5.3"
# Düşünme açıkken 4096 token'lık bütçeyi düşünmeye harcayıp boş cevap döndü (86 sn);
# kapalıyken aynı görev 4 sn'de geçerli JSON verdi (26 Eylül ölçümü).
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[models.deepseek]
# Hızlı yedek: araç çağırma, düşünme, yapılandırılmış çıktı, görüntü.
provider = "evren"
model_id = "deepseek-v4.1-flash"

[models.qwen_vl]
provider = "evren"
model_id = "qwen3-vl-30b"

[models.gemma]
provider = "evren"
model_id = "gemma-4-31b"

# --- Organizatörlerin GLM uç noktası (GLM_API_KEY / GLM_API_BASE) ----------------
[models.glm_org]
# Gateway yalnızca bu adı kabul eder; başka ad 400 "key not allowed to access model".
provider = "glm"
model_id = "glm-5.3-flash"
# Gateway'de düşünme kapatılamaz ve `thinking` parametresi hata verir; miktarı
# reasoning_effort ayarlar (low: ~10-15 sn).
extra_body = { reasoning_effort = "low" }

# --- Claude (ANTHROPIC_API_KEY tanımlıysa) ---------------------------------------
[models.haiku]
provider = "anthropic"
model_id = "claude-haiku-4-5"

[models.sonnet]
provider = "anthropic"
model_id = "claude-sonnet-5"

[models.opus]
provider = "anthropic"
model_id = "claude-opus-5-5"

[tasks]
report_parse = ["glm_org", "glm53", "deepseek", "haiku"]
vision = ["glm_org", "qwen_vl", "gemma", "deepseek", "sonnet"]
reasoning = ["glm_org", "glm53", "deepseek", "opus"]
chat = ["glm_org", "glm53", "deepseek", "sonnet"]
